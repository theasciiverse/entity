[package]
name = "entity"
version = "0.1.0"
edition = "2021"
description = "N++-inspired precision platformer for the terminal (Asciiverse)"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gilrs = { version = "0.11", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]
